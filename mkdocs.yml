site_name: Local Grown Salads Messaging API (Producer)
theme:
  name: material
  palette:
    primary: 'indigo'
    accent: 'indigo'
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - search.highlight
    - search.suggest
    - content.code.annotate
    - content.code.copy
    - content.code.expand
    - content.code.tabbed
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
use_directory_urls: false
